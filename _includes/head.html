<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=12.0, minimum-scale=1.0, user-scalable=yes">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* --- 90s retro look (was: Inter + grey #f2f2f4 + navy links) --- */
  /* Very light grey background (overrides theme's off-white) */
  html {
    background: #e6e6e6 !important;
    font-family: 'Times New Roman', Times, Georgia, serif;
  }
  p, li, blockquote, td, th, a, h1, h2, h3, h4, h5, h6 {
    font-family: 'Times New Roman', Times, Georgia, serif;
  }
  p, li, blockquote, td, th {
    font-size: 15px;
  }
  /* Headings only a touch bigger than body text (theme sizes them ~22px) */
  h1, h2, h3, h4, h5, h6 {
    font-size: 17px;
  }
  /* Comfortable line spacing */
  p, li, blockquote {
    line-height: 1.6;
  }
  /* Classic web links: blue, purple when visited, underlined, not bold.
     Keep the top nav (a.title) black. */
  a:not(.title) {
    color: #0000EE;
    font-weight: normal;
    text-decoration: underline;
  }
  a:not(.title):visited {
    color: #551A8B;
  }
  /* Theme's `* { font-size:16px }` reset stops inline tags from inheriting;
     make emphasis match the surrounding text */
  p em, p i, p strong, p b, li em, li i, li strong, li b {
    font-size: inherit;
  }
  /* Left-aligned body text, 90s style */
  p, li, blockquote {
    text-align: left;
  }

  /* Homepage intro: photo beside text on wide screens */
  .home-intro {
    display: flex;
    gap: 2em;
    align-items: flex-start;
  }
  .home-photo {
    width: 270px;
    flex-shrink: 0;
  }
  .home-photo > img {
    width: 100%;
    border: 2px solid #808080;
    display: block;
  }
  .photo-name {
    margin: 0.6em 0 0;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    /* Stack the photo above the text and center it */
    .home-intro {
      flex-direction: column;
      gap: 1em;
      align-items: center;
    }
    .home-photo {
      width: 100%;
      max-width: 300px;
    }
    /* Justified text creates ugly gaps on narrow screens */
    p, li, blockquote {
      text-align: left;
    }
  }
</style>

{% if site.favicon %}
  <link rel="icon" href="{{ site.favicon | relative_url }}">
{% endif %}

<link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ site.feed.path | default: '/rss.xml' | relative_url }}">

{% seo %}
