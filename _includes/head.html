<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=12.0, minimum-scale=1.0, user-scalable=yes">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* White background (overrides theme's off-white) */
  html {
    background: #fff !important;
    font-family: 'Merriweather', Georgia, 'Times New Roman', serif;
  }
  p, li, blockquote, td, th, a, h1, h2, h3, h4, h5, h6 {
    font-family: 'Merriweather', Georgia, 'Times New Roman', serif;
  }
  p, li, blockquote, td, th {
    font-size: 15px;
  }
  /* Theme's `* { font-size:16px }` reset stops inline tags from inheriting;
     make emphasis match the surrounding text */
  p em, p i, p strong, p b, li em, li i, li strong, li b {
    font-size: inherit;
  }
  /* Left-align body text (overrides theme's justified text) */
  p, li, blockquote {
    text-align: left;
  }

  /* Homepage intro: photo beside text on wide screens */
  .home-intro {
    display: flex;
    gap: 2em;
    align-items: flex-start;
  }
  .home-photo {
    width: 270px;
    flex-shrink: 0;
  }
  .home-photo > img {
    width: 100%;
    border-radius: 4px;
    display: block;
  }
  .photo-name {
    margin: 0.6em 0 0;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
  }

  /* Mobile adjustments */
  @media (max-width: 600px) {
    /* Stack the photo above the text and center it */
    .home-intro {
      flex-direction: column;
      gap: 1em;
      align-items: center;
    }
    .home-photo {
      width: 100%;
      max-width: 300px;
    }
    /* Justified text creates ugly gaps on narrow screens */
    p, li, blockquote {
      text-align: left;
    }
  }
</style>

{% if site.favicon %}
  <link rel="icon" href="{{ site.favicon | relative_url }}">
{% endif %}

<link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ site.feed.path | default: '/rss.xml' | relative_url }}">

{% seo %}
